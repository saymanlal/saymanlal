name: Generate Profile Trophy

# Self-hosts trophy.svg in this repo so the README never depends on the
# live vercel.app instance (which cold-starts / rate-limits and shows a
# broken image on GitHub mobile). README references this file first via
# a <picture> tag, falling back to the live service only if this is missing.

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3 AM UTC
  workflow_dispatch:        # allows manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: saymanlal
          output_path: trophy.svg
          theme: tokyonight
          column: "6"
          row: "1"
          margin-w: "8"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy.svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh trophy.svg"
          file_pattern: trophy.svg
